version: "3.8"

services:
  merchantpilot:
    build: .
    container_name: merchantpilot-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persist audit logs and model artifacts
      - ./logs:/app/logs
      - ./models/saved_models:/app/models/saved_models
      - ./data/synthetic:/app/data/synthetic
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
